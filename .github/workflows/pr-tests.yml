name: PR tests

# Runs the mcp/ pytest suite on pushes to main and on PRs touching mcp/**.
# The suite proves the package contract locally; the wheel-level proof
# (PyPI contains what the tag promises) is the publish.yml + PyPI JSON
# check, not this file.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "mcp/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        working-directory: mcp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        working-directory: mcp
        run: python -m pytest tests/ -q
