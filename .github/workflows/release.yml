# Bridge release — exe build (windows/linux amd64) + GitHub release + Nextcloud sync.
#
# Migrated from iowap-org/iowap-bridge-daemon/.github/workflows/release.yml
# (T-039 subtree merge, 2026-11-25). Changes vs. the original:
#   - trigger tag prefix v* -> bridge-v* (collision-free against the mcp/
#     wheel-v* tags of this repo)
#   - build steps run with working-directory: bridge/; binaries still land at
#     the workspace root (asset names and nextcloud-sync layout unchanged)
#   - workflow_dispatch added: a manual run BUILDS ONLY — release upload and
#     nextcloud-sync are gated to tag refs (no accidental publish)
# Requires repo secrets: NEXTCLOUD_HOST / NEXTCLOUD_USERNAME / NEXTCLOUD_PASSWORD.
name: release

on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        working-directory: bridge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          LDFLAGS="-s -w"
          # windowsgui subsystem for the Windows release (v0.3.1): a
          # double-click start shows NO console window — not even a flash,
          # the OS never creates one. --debug / IOWAP_BRIDGE_DEBUG=1
          # allocates one at runtime (internal/console); logs otherwise go
          # to %LOCALAPPDATA%\iowap-bridge\daemon.log (internal/logging).
          if [ "$GOOS" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H=windowsgui"
          fi
          # binary lands at the workspace root: release-asset names and the
          # nextcloud-sync step consume them exactly like the daemon repo did
          go build -trimpath -ldflags "$LDFLAGS" -o "$GITHUB_WORKSPACE/iowap-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/iowap-bridge
      - name: Checksum
        run: sha256sum iowap-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} > iowap-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256
      - name: Upload release assets
        # dispatch runs are build-only smoke tests — no release, no publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iowap-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            iowap-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256

  nextcloud-sync:
    # Auto-delivery: mirror the release binaries into the user's Nextcloud
    # (Shared/iowap-bridge/) so the latest exe is always downloadable without
    # a manual copy step. Stable paths, plain PUT overwrites.
    # Tag-gated: workflow_dispatch must not touch Nextcloud (T-039 gate).
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          for a in iowap-bridge-windows-amd64.exe iowap-bridge-windows-amd64.exe.sha256 \
                   iowap-bridge-linux-amd64 iowap-bridge-linux-amd64.sha256; do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --paginate \
              | jq -r --arg n "$a" '.assets[] | select(.name == $n) | .url' \
              | head -1 | xargs -r -I{} curl -sL -H "Authorization: token ${GH_TOKEN}" \
                  -H "Accept: application/octet-stream" -o "dist/$a" {}
          done
          ls -la dist/
      - name: Upload to Nextcloud (Shared/iowap-bridge/ + versioned folder)
        env:
          NC_HOST: ${{ secrets.NEXTCLOUD_HOST }}
          NC_USER: ${{ secrets.NEXTCLOUD_USERNAME }}
          NC_PASS: ${{ secrets.NEXTCLOUD_PASSWORD }}
        run: |
          set -euo pipefail
          # NC_HOST may or may not carry a scheme — strip any, re-add one.
          BASE="https://${NC_HOST#*//}"
          AUTH="${NC_USER}:${NC_PASS}"
          ROOT="${BASE}/remote.php/dav/files/${NC_USER}/Shared/iowap-bridge"
          TAG="${GITHUB_REF_NAME}"
          # Stable "latest" paths + a per-version archive folder that is
          # never overwritten (Ronny: "leg immer einen neuen versions ordner an").
          for dir in "$ROOT" "$ROOT/$TAG"; do
            curl -s -o /dev/null -u "$AUTH" -X MKCOL "$dir" || true
          done
          for f in dist/*; do
            name="$(basename "$f")"
            for target in "$ROOT" "$ROOT/$TAG"; do
              code="$(curl -s -o /dev/null -w '%{http_code}' -u "$AUTH" \
                -T "$f" "${target}/${name}")"
              echo "${target##*/}/${name} -> ${code}"
              [ "$code" = "201" ] || [ "$code" = "204" ]
            done
          done
          printf '%s\n' "$TAG" | curl -s -o /dev/null -w 'latest VERSION.txt -> %{http_code}\n' \
            -u "$AUTH" -T - "$ROOT/VERSION.txt"
          printf '%s\n' "$TAG" | curl -s -o /dev/null -w 'versioned VERSION.txt -> %{http_code}\n' \
            -u "$AUTH" -T - "$ROOT/$TAG/VERSION.txt"
