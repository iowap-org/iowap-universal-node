name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o iowap-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/iowap-bridge
      - name: Checksum
        run: sha256sum iowap-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} > iowap-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iowap-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            iowap-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256
