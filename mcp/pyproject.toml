[project]
name = "iowap-node-mcp"
version = "0.1.2"
description = "IOWAP container MCP HTTP surface — Streamable HTTP /mcp + multi-bearer auth + token-bound scoping over the iowap-client-mcp toolset + T-042 capability-manage tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "iowap-client-mcp>=0.2.0",
    "mcp>=1.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
iowap-node-mcp = "iowap_node_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iowap_node_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
